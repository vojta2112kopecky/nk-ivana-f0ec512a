<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor – NK Ivana</title>
<link rel="stylesheet" href="styles.css?v=1784153788">
</head>
<body>
<div class="ed-bar">
  <span class="ttl">✏️ Editor · NK Ivana</span>
  <button class="btn ghost" id="previewBtn">👁 Náhled</button>
  <button class="btn" id="downloadBtn">🚀 Publikovat živě</button>
  <button class="btn ghost" id="resetBtn">↺ Zahodit změny</button>
  <button class="btn ghost" id="copyBtn">📋 Kopírovat JSON</button>
  <button class="btn ghost" id="downloadJson">💾 Záloha (.js)</button>
</div>
<div class="wrap" style="padding-top:16px">
  <p class="hint">Uprav texty níže. Formátování: <b>**tučně**</b>, <i>*kurzíva*</i>, <code>- odrážka</code>, <code>1. číslo</code>, <code>&gt; rámeček</code>, <code>[text](odkaz)</code>. Přes <b>👁 Náhled</b> zkontroluješ, jak to vypadá, a <b>🚀 Publikovat živě</b> = změny se <b>hned projeví na webu</b> (i u Ivany). Žádné stahování ani GitHub.</p>
  <div id="editor"></div>
  <div class="foot">Editor NK · jen pro Vojtu 💛</div>
</div>
<dialog id="prev">
  <div class="ed-bar"><span class="ttl">Náhled</span><button class="btn ghost" id="prevClose">Zavřít</button></div>
  <div id="prevBody" style="max-height:78vh;overflow:auto;padding:16px 4px"></div>
</dialog>
<script src="content.js?v=1784153788"></script>
<script src="nk-supabase.js?v=1784153788"></script>
<script src="render.js?v=1784153788"></script>
<script src="editor.js?v=1784153788"></script>
</body>
</html>
